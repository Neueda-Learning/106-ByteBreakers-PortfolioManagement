# ============================================
# Nginx Configuration for React/Vite SPA
# ============================================
# This configuration serves a React Single Page Application (SPA) built with Vite
# Key features:
# - SPA routing support: All routes redirect to index.html for React Router
# - Gzip compression: Enabled for text-based assets to reduce bandwidth
# - Cache headers: Optimized for static assets with content hashing
# - Security headers: Basic security headers included
# - Performance: Optimized for high throughput and low latency

user nginx;

# Auto-detect number of CPU cores for optimal worker processes
worker_processes auto;

# Maximum number of open files per worker process
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Number of connections per worker process
    worker_connections 10000;
    
    # Optimized for Linux systems
    use epoll;
    
    # Multiple accepts to improve throughput under high load
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================
    # Logging Configuration
    # ============================================
    # Log format with response time and cache status
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ============================================
    # Performance Optimizations
    # ============================================
    # Send files efficiently using sendfile()
    sendfile on;
    
    # Combine multiple packets into one for efficiency
    tcp_nopush on;
    tcp_nodelay on;

    # Keep-alive connection timeout
    keepalive_timeout 65;

    # ============================================
    # Gzip Compression
    # ============================================
    # Compress responses to reduce bandwidth
    gzip on;
    
    # Compression level: 1-9 (1=fastest, 9=best compression)
    # Level 6 is a good balance between compression and CPU
    gzip_comp_level 6;
    
    # Minimum response size to compress (bytes)
    # Don't compress very small responses
    gzip_min_length 1024;
    
    # MIME types to compress
    # Compress text, JSON, CSS, JavaScript, SVG, but not images
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript application/xml 
               image/svg+xml;
    
    # Enable compression for proxied requests
    gzip_proxied any;
    
    # Add Vary header for cache compatibility
    gzip_vary on;

    # ============================================
    # Security Headers
    # ============================================
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable XSS protection in older browsers
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Enable XSS filter in browser
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy (basic)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:" always;

    # ============================================
    # Server Configuration
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        
        server_name _;
        
        # Root directory where static files are located
        # This is where the Vite dist/ folder is copied in the Dockerfile
        root /usr/share/nginx/html;
        
        # Index file for directory requests
        index index.html index.htm;

        # ============================================
        # React Router SPA Routing
        # ============================================
        # This is the key configuration for SPAs
        # Requests to non-existent files/directories are redirected to index.html
        # React Router then handles the routing on the client side
        # Examples:
        # - /dashboard → /index.html (React Router matches /dashboard)
        # - /portfolio → /index.html (React Router matches /portfolio)
        # - /investments → /index.html (React Router matches /investments)
        # - /bundle.abc123.js → Serves the actual JS file
        # - /styles.def456.css → Serves the actual CSS file
        location / {
            # Try to serve the request as a file ($uri)
            # If file doesn't exist, try as a directory ($uri/)
            # If neither exists, redirect to index.html
            try_files $uri $uri/ /index.html;
            
            # Add security headers for HTML
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # ============================================
        # Static Assets Caching
        # ============================================
        # Cache versioned assets (Vite adds content hash to filenames)
        # These files have unique hashes and won't change
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            # Cache for 1 year (long expiry is safe because files have content hash)
            add_header Cache-Control "public, max-age=31536000, immutable";
            
            # Enable gzip compression for these assets
            gzip on;
        }

        # ============================================
        # Disable Caching for index.html
        # ============================================
        # index.html should not be cached so browser checks for new version
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate, public, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ============================================
        # Error Pages
        # ============================================
        # Handle 404 errors by serving index.html
        # This allows React Router to handle the routing
        error_page 404 /index.html;
    }
}
