# Spring Boot Application Configuration - Docker Environment
# This configuration is used when the application runs inside Docker containers

# Application name
spring.application.name=portfolioManager

# Server configuration for Docker
# Port 8080 is the container port (mapped to 8081 on the host)
server.port=8080

# Database configuration for Docker
# Database host is 'mysql' - the Docker service name in docker-compose.yml
# Docker's internal DNS resolves service names automatically
# Port 3306 is the standard MySQL port
# Database name: portfolio_manager
spring.datasource.url=jdbc:mysql://mysql:3306/portfolio_manager
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization
# This will run schema.sql and data.sql on application startup
# Ensures database tables and sample data are created if they don't exist
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql,classpath:data.sql

# Connection pool configuration
# HikariCP is Spring Boot's default connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=true

# Logging configuration
logging.level.root=INFO
logging.level.com.neueda.portfolio=DEBUG

# Server servlet configuration
server.servlet.context-path=/
