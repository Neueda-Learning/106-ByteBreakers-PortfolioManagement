# Spring Boot Application Configuration - Docker Environment
# This configuration is used when the application runs inside Docker containers

# Application name
spring.application.name=portfolioManager

# Server configuration for Docker
# Port 8080 is the container port (mapped to 8081 on the host)
server.port=8080

# Database configuration for Docker
# Database host is 'mysql' - the Docker service name in docker-compose.yml
# Docker's internal DNS resolves service names automatically
# Port 3306 is the standard MySQL port
# Database name: portfolio_manager
# Connection parameters:
#   allowPublicKeyRetrieval=true: Allow RSA public key retrieval for authentication
#   useSSL=false: Disable SSL (not needed in Docker network)
#   serverTimezone=UTC: Set timezone explicitly
#   allowMultiQueries=true: Allow multiple queries in one statement
#   connectTimeout=10000: Connection timeout in milliseconds
spring.datasource.url=jdbc:mysql://mysql:3306/portfolio_manager?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&allowMultiQueries=true&connectTimeout=10000
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization
# Set to 'never' because MySQL auto-initialization happens in docker-entrypoint-initdb.d/
# when the container first starts. This prevents Spring from trying to re-run the scripts
# and causing errors due to tables already existing.
spring.sql.init.mode=never

# Connection pool configuration
# HikariCP is Spring Boot's default connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=true

# Logging configuration
logging.level.root=INFO
logging.level.com.neueda.portfolio=DEBUG

# Server servlet configuration
server.servlet.context-path=/
